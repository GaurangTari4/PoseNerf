[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "posenerf"
version = "0.1.0"
description = "PoseNeRF: end-to-end hierarchical NeRF pipeline for camera pose estimation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "numpy>=1.24,<3",
  "pillow>=9.1",
  "matplotlib>=3.7",
  "tqdm>=4.65",
  "imageio>=2.31",
  "opencv-python-headless>=5.0",
]

[tool.setuptools.packages.find]
where = ["."]
